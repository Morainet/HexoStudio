<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fafbfc">
  <title data-i18n="HexoStudio · 博客工作台">HexoStudio · 博客工作台</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2">
  <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
  <script src="/i18n.js"></script>
  <script src="/preferences.js"></script>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="preferences-home" class="preferences-home">
    <div id="display-preferences" class="display-preferences" role="group" aria-label="显示偏好" data-i18n-aria-label="显示偏好">
      <label class="preference-control"><svg class="icon" aria-hidden="true"><use href="#i-appearance"/></svg><select id="theme-preference" aria-label="外观" data-i18n-aria-label="外观" title="外观" data-i18n-title="外观"><option value="system" data-i18n="跟随系统">跟随系统</option><option value="light" data-i18n="浅色">浅色</option><option value="dark" data-i18n="深色">深色</option></select></label>
      <label class="preference-control"><svg class="icon" aria-hidden="true"><use href="#i-language"/></svg><select id="language-preference" aria-label="语言" data-i18n-aria-label="语言" title="语言" data-i18n-title="语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
    </div>
  </div>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-appearance" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-language" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-post" viewBox="0 0 24 24"><path d="M7 3h8l4 4v13a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v5h5M9 12h6M9 16h6"/></symbol>
    <symbol id="i-pages" viewBox="0 0 24 24"><rect x="7" y="3" width="13" height="16" rx="2"/><path d="M4 7v13a1 1 0 0 0 1 1h11M10 8h6M10 12h6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 3.5 14 5l2.4-.4.8 2.3 2.2 1.1-.6 2.3 1 2.2-1.6 1.9.1 2.4-2.3.7-1.5 1.9-2.3-.7-2.3.7-1.5-1.9-2.3-.7.1-2.4L4.6 12l1-2.2L5 7.5l2.2-1.1L8 4.1l2.4.4L12 3.5Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-git" viewBox="0 0 24 24"><circle cx="7" cy="6" r="2"/><circle cx="17" cy="6" r="2"/><circle cx="7" cy="18" r="2"/><path d="M7 8v8M17 8v3a4 4 0 0 1-4 4H9"/></symbol>
    <symbol id="i-rocket" viewBox="0 0 24 24"><path d="M12 16c5.5-2 8-6.5 8-13-6.5 0-11 2.5-13 8l5 5ZM7 11l-3 1-1 5 5-2M12 16l-1 4-5 1 1-4M8 16l-2 2"/><circle cx="15.5" cy="8" r="1.4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="m4 20 4.5-1 11-11a2.1 2.1 0 0 0-3-3l-11 11L4 20ZM14.5 6.5l3 3"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 3 3 3-3 5 5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3V7Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 13 4-4M8 16H6a4 4 0 0 1 0-8h3M16 8h2a4 4 0 0 1 0 8h-3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 5.1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3 3.8M6.4 6.4A21 21 0 0 0 2 12s3.5 7 10 7a11 11 0 0 0 5.6-1.6M10 10a3 3 0 0 0 4 4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M13 8l4 4-4 4M8 12h9"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
  </svg>
  <div id="auth-screen" class="auth-screen hidden">
    <form id="auth-form" class="auth-card">
      <div id="auth-steps" class="setup-progress hidden" data-step="1" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" aria-label="初始化进度" data-i18n-aria-label="初始化进度"><div class="setup-progress-caption"><span data-i18n="首次设置">首次设置</span><span id="auth-step-count">1 / 3</span></div><div class="setup-progress-track" aria-hidden="true"><span></span></div></div>
      <div class="auth-heading"><div class="auth-brand" aria-hidden="true">H</div><div><div class="eyebrow">HEXOSTUDIO</div><h1 id="auth-title"><span data-i18n="登录工作台">登录工作台</span></h1></div></div>
      <p id="auth-description"><span data-i18n="使用管理员账号继续管理博客。">使用管理员账号继续管理博客。</span></p>
      <fieldset id="auth-account-fields" class="auth-fields">
        <label id="auth-setup-key-row" class="hidden"><span data-i18n="初始化密钥">初始化密钥</span><input id="auth-setup-key" type="password" autocomplete="off" placeholder="HEXOSTUDIO_SETUP_KEY" disabled></label>
        <label><span data-i18n="用户名">用户名</span><input id="auth-username" name="username" autocomplete="username" minlength="3" maxlength="32" required></label>
        <div class="auth-passwords">
          <label><span data-i18n="密码">密码</span><span class="password-control"><input id="auth-password" name="password" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" data-password-toggle="auth-password" aria-controls="auth-password" aria-label="显示密码" data-i18n-aria-label="显示密码"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></button></span></label>
          <label id="auth-confirm-row" class="hidden"><span data-i18n="确认密码">确认密码</span><span class="password-control"><input id="auth-confirm" name="confirm" type="password" autocomplete="new-password"><button type="button" class="password-toggle" data-password-toggle="auth-confirm" aria-controls="auth-confirm" aria-label="显示密码" data-i18n-aria-label="显示密码"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></button></span></label>
        </div>
      </fieldset>
      <fieldset id="auth-storage-row" class="auth-fields hidden" disabled>
        <label><span data-i18n="数据库类型">数据库类型</span><select id="auth-storage-type"><option value="postgres">PostgreSQL</option><option value="mysql">MySQL</option><option value="mongodb">MongoDB</option></select></label>
        <div id="auth-storage-fields"></div>
        <p class="storage-help"><span data-i18n="填写已有数据库的连接地址，验证成功后继续。">填写已有数据库的连接地址，验证成功后继续。</span></p>
      </fieldset>
      <p id="auth-error" class="auth-error hidden" role="alert"></p>
      <div class="auth-actions"><button id="auth-back" class="secondary hidden" type="button"><span data-i18n="上一步">上一步</span></button><button id="auth-submit" class="primary" type="submit"><span data-i18n="登录">登录</span></button></div>
    </form>
  </div>
  <div id="setup-blog-screen" class="auth-screen hidden"></div>
  <div id="app" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">H</span><div><strong>HexoStudio</strong><small><span data-i18n="内容管理工作台">内容管理工作台</span></small></div></div>
      <div class="workspace-label"><span data-i18n="工作空间">工作空间 </span><span>WORKSPACE</span></div>
      <nav class="nav" aria-label="主导航" data-i18n-aria-label="主导航">
        <button data-view="dashboard" class="active"><svg class="icon nav-icon"><use href="#i-grid"/></svg><span><span data-i18n="概览">概览</span></span></button>
        <button data-view="posts"><svg class="icon nav-icon"><use href="#i-post"/></svg><span><span data-i18n="文章管理">文章管理</span></span></button>
        <button data-view="pages"><svg class="icon nav-icon"><use href="#i-pages"/></svg><span><span data-i18n="页面管理">页面管理</span></span></button>
        <button data-view="config"><svg class="icon nav-icon"><use href="#i-settings"/></svg><span><span data-i18n="站点配置">站点配置</span></span></button>
        <button data-view="git"><svg class="icon nav-icon"><use href="#i-git"/></svg><span><span data-i18n="Git 仓库">Git 仓库</span></span></button>
        <button data-view="deploy"><svg class="icon nav-icon"><use href="#i-rocket"/></svg><span><span data-i18n="构建与部署">构建与部署</span></span></button>
      </nav>
      <div class="sidebar-bottom"><div id="preferences-workspace"></div><div class="project-chip"><span class="project-icon"><svg class="icon"><use href="#i-folder"/></svg></span><div><strong id="project-name"><span data-i18n="尚未连接项目">尚未连接项目</span></strong><small id="project-path"><span data-i18n="请选择 Hexo 目录">请选择 Hexo 目录</span></small></div><span class="status-dot"></span></div><button id="change-project" class="text-button"><svg class="icon"><use href="#i-folder"/></svg><span data-i18n="切换项目">切换项目</span></button><button id="account-settings" class="text-button"><svg class="icon"><use href="#i-lock"/></svg><span data-i18n="修改密码">修改密码</span></button><button id="account-storage" class="text-button"><svg class="icon"><use href="#i-database"/></svg><span data-i18n="账号存储">账号存储</span></button><button id="logout" class="text-button"><svg class="icon"><use href="#i-logout"/></svg><span data-i18n="退出登录">退出登录</span></button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="topbar-location"><span class="topbar-label">HEXOSTUDIO</span><div id="breadcrumb"><span data-i18n="工作空间 / 概览">工作空间 / 概览</span></div></div><div class="top-actions"><span id="connection" class="connection"><span data-i18n="本地工作台">本地工作台</span></span><button id="top-new" class="primary small"><svg class="icon"><use href="#i-plus"/></svg><span><span data-i18n="新建文章">新建文章</span></span></button></div></header>
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="modal" class="modal-backdrop hidden" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button id="modal-close" class="icon-button close" aria-label="关闭" data-i18n-aria-label="关闭">×</button><div id="modal-content"></div><div id="modal-feedback" class="modal-feedback hidden" role="status" tabindex="-1"></div></div></div>
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>

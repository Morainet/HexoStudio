<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8fb">
  <title>HexoStudio · 博客工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="auth-screen" class="auth-screen hidden"><form id="auth-form" class="auth-card"><div class="auth-brand">H<span>✦</span></div><div class="eyebrow">HEXOSTUDIO</div><h1 id="auth-title">登录工作台</h1><p id="auth-description">使用管理员账号继续管理博客。</p><label>用户名<input id="auth-username" name="username" autocomplete="username" required></label><label>密码<input id="auth-password" name="password" type="password" autocomplete="current-password" required></label><label id="auth-confirm-row" class="hidden">确认密码<input id="auth-confirm" name="confirm" type="password" autocomplete="new-password"></label><p id="auth-error" class="auth-error hidden" role="alert"></p><button id="auth-submit" class="primary" type="submit">登录</button></form></div>
  <div id="app" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">H<span>✦</span></span><div><strong>HexoStudio</strong><small>创作与发布空间</small></div></div>
      <div class="workspace-label">工作空间</div>
      <nav class="nav" aria-label="主导航">
        <button data-view="dashboard" class="active"><span class="nav-icon">◫</span>概览</button>
        <button data-view="posts"><span class="nav-icon">▤</span>文章管理</button>
        <button data-view="config"><span class="nav-icon">⚙</span>站点配置</button>
        <button data-view="git"><span class="nav-icon">⑂</span>Git 仓库</button>
        <button data-view="deploy"><span class="nav-icon">↗</span>构建与部署</button>
      </nav>
      <div class="sidebar-bottom"><div class="project-chip"><span class="status-dot"></span><div><strong id="project-name">尚未连接项目</strong><small id="project-path">请选择 Hexo 目录</small></div></div><button id="change-project" class="text-button">切换项目 ↗</button><button id="account-settings" class="text-button">修改密码</button><button id="logout" class="text-button">退出登录</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div id="breadcrumb">工作空间 / 概览</div><div class="top-actions"><span id="connection" class="connection">本地工作台</span><button id="top-new" class="primary small">＋ 新建文章</button></div></header>
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="modal" class="modal-backdrop hidden" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button id="modal-close" class="icon-button close" aria-label="关闭">×</button><div id="modal-content"></div></div></div>
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>

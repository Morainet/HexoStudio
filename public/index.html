<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <title>HexoStudio · 博客工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-post" viewBox="0 0 24 24"><path d="M7 3h8l4 4v13a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v5h5M9 12h6M9 16h6"/></symbol>
    <symbol id="i-pages" viewBox="0 0 24 24"><rect x="7" y="3" width="13" height="16" rx="2"/><path d="M4 7v13a1 1 0 0 0 1 1h11M10 8h6M10 12h6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 3.5 14 5l2.4-.4.8 2.3 2.2 1.1-.6 2.3 1 2.2-1.6 1.9.1 2.4-2.3.7-1.5 1.9-2.3-.7-2.3.7-1.5-1.9-2.3-.7.1-2.4L4.6 12l1-2.2L5 7.5l2.2-1.1L8 4.1l2.4.4L12 3.5Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-git" viewBox="0 0 24 24"><circle cx="7" cy="6" r="2"/><circle cx="17" cy="6" r="2"/><circle cx="7" cy="18" r="2"/><path d="M7 8v8M17 8v3a4 4 0 0 1-4 4H9"/></symbol>
    <symbol id="i-rocket" viewBox="0 0 24 24"><path d="M12 16c5.5-2 8-6.5 8-13-6.5 0-11 2.5-13 8l5 5ZM7 11l-3 1-1 5 5-2M12 16l-1 4-5 1 1-4M8 16l-2 2"/><circle cx="15.5" cy="8" r="1.4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="m4 20 4.5-1 11-11a2.1 2.1 0 0 0-3-3l-11 11L4 20ZM14.5 6.5l3 3"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 3 3 3-3 5 5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3V7Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 13 4-4M8 16H6a4 4 0 0 1 0-8h3M16 8h2a4 4 0 0 1 0 8h-3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M13 8l4 4-4 4M8 12h9"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
  </svg>
  <div id="auth-screen" class="auth-screen hidden">
    <form id="auth-form" class="auth-card">
      <div class="auth-heading"><div class="auth-brand" aria-hidden="true">H<span>✦</span></div><div><div class="eyebrow">HEXOSTUDIO</div><h1 id="auth-title">登录工作台</h1></div></div>
      <p id="auth-description">使用管理员账号继续管理博客。</p>
      <ol id="auth-steps" class="auth-steps hidden" aria-label="初始化进度"><li data-auth-step="storage">1 · 数据库</li><li data-auth-step="account">2 · 管理员</li><li>3 · 博客</li></ol>
      <fieldset id="auth-account-fields" class="auth-fields">
        <label>用户名<input id="auth-username" name="username" autocomplete="username" minlength="3" maxlength="32" required></label>
        <div class="auth-passwords">
          <label>密码<input id="auth-password" name="password" type="password" autocomplete="current-password" required></label>
          <label id="auth-confirm-row" class="hidden">确认密码<input id="auth-confirm" name="confirm" type="password" autocomplete="new-password"></label>
        </div>
      </fieldset>
      <fieldset id="auth-storage-row" class="auth-fields hidden" disabled>
        <label>数据库类型<select id="auth-storage-type"><option value="postgres">PostgreSQL</option><option value="mysql">MySQL</option><option value="mongodb">MongoDB</option></select></label>
        <div id="auth-storage-fields"></div>
        <p class="storage-help">填写已有数据库的连接地址，验证成功后继续。</p>
      </fieldset>
      <p id="auth-error" class="auth-error hidden" role="alert"></p>
      <div class="auth-actions"><button id="auth-back" class="secondary hidden" type="button">上一步</button><button id="auth-submit" class="primary" type="submit">登录</button></div>
    </form>
  </div>
  <div id="setup-blog-screen" class="auth-screen hidden"></div>
  <div id="app" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">H<span>✦</span></span><div><strong>HexoStudio</strong><small>创作与发布空间</small></div></div>
      <div class="workspace-label">工作空间 <span>WORKSPACE</span></div>
      <nav class="nav" aria-label="主导航">
        <button data-view="dashboard" class="active"><svg class="icon nav-icon"><use href="#i-grid"/></svg><span>概览</span></button>
        <button data-view="posts"><svg class="icon nav-icon"><use href="#i-post"/></svg><span>文章管理</span></button>
        <button data-view="pages"><svg class="icon nav-icon"><use href="#i-pages"/></svg><span>页面管理</span></button>
        <button data-view="config"><svg class="icon nav-icon"><use href="#i-settings"/></svg><span>站点配置</span></button>
        <button data-view="git"><svg class="icon nav-icon"><use href="#i-git"/></svg><span>Git 仓库</span></button>
        <button data-view="deploy"><svg class="icon nav-icon"><use href="#i-rocket"/></svg><span>构建与部署</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="project-chip"><span class="project-icon"><svg class="icon"><use href="#i-folder"/></svg></span><div><strong id="project-name">尚未连接项目</strong><small id="project-path">请选择 Hexo 目录</small></div><span class="status-dot"></span></div><button id="change-project" class="text-button"><svg class="icon"><use href="#i-folder"/></svg>切换项目</button><button id="account-settings" class="text-button"><svg class="icon"><use href="#i-lock"/></svg>修改密码</button><button id="account-storage" class="text-button"><svg class="icon"><use href="#i-database"/></svg>账号存储</button><button id="logout" class="text-button"><svg class="icon"><use href="#i-logout"/></svg>退出登录</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="topbar-location"><span class="topbar-label">HEXOSTUDIO</span><div id="breadcrumb">工作空间 / 概览</div></div><div class="top-actions"><span id="connection" class="connection">本地工作台</span><button id="top-new" class="primary small"><svg class="icon"><use href="#i-plus"/></svg><span>新建文章</span></button></div></header>
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="modal" class="modal-backdrop hidden" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button id="modal-close" class="icon-button close" aria-label="关闭">×</button><div id="modal-content"></div></div></div>
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
